# ============================================================================================= #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Validates the merged keycloak_db_config configuration on the CONTROLLER, before anything
# touches the guest. Every name below reaches SQL as an identifier, so this is also the one place
# their shape is checked; the tasks pass them to the modules with trust_input.
# defaults/main.yml describes these inputs; this file enforces them.
#
# ============================================================================================= #
---

# check: safety-critical
# absent drops the role and the schema by these names, and present alters the role.
- name: 'VALIDATE | Require The Database, Its Administrator, The Role And The Schema'
  vars:
    __identifier__: '^[A-Za-z_][A-Za-z0-9_]*$'
  when: (state | default('present') | string | lower | trim) in ['present', 'absent']

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to continue: the playbook must supply host, name, administrator.username,
      administrator.password, role.name and schema, each name an identifier, and port must be an
      integer above 0. The schema must not be public, which absent would drop with everything in
      it, and the role must not be the administrator, which present would alter and absent drop.
      No password is echoed. Got host '{{ keycloak_db_config_running.host }}', port
      '{{ keycloak_db_config_running.port }}', name '{{ keycloak_db_config_running.name }}',
      administrator '{{ keycloak_db_config_running.administrator.username }}', role
      '{{ keycloak_db_config_running.role.name }}', schema
      '{{ keycloak_db_config_running.schema }}'.
    quiet: true
    that:
      - keycloak_db_config_running.host is match('^[A-Za-z0-9.-]+$')
      - keycloak_db_config_running.port is integer
      - keycloak_db_config_running.port > 0
      - keycloak_db_config_running.name is match(__identifier__)
      - keycloak_db_config_running.administrator.username is match(__identifier__)
      - keycloak_db_config_running.administrator.password | length > 0
      - keycloak_db_config_running.role.name is match(__identifier__)
      - keycloak_db_config_running.schema is match(__identifier__)
      - keycloak_db_config_running.schema != 'public'
      - keycloak_db_config_running.role.name != keycloak_db_config_running.administrator.username

- name: 'VALIDATE | Require The Role Password And Connection Limit'
  when: (state | default('present') | string | lower | trim) == 'present'

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to deploy: the playbook must supply role.password in printable ASCII, which the
      verifier filter needs because it applies no SASLprep, and an integer
      role.connection_limit above 0. Got connection_limit
      '{{ keycloak_db_config_running.role.connection_limit }}'.
    quiet: true
    that:
      - keycloak_db_config_running.role.password is match('^[ -~]+\Z')
      - keycloak_db_config_running.role.connection_limit is integer
      - keycloak_db_config_running.role.connection_limit > 0
