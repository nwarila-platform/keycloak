# ============================================================================================= #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the keycloak_db_config role. The v3 loader merges the OS
# overlay in vars/ over this map and publishes the result as 'keycloak_db_config_running'; tasks
# read only that.
#
# Universally safe values live here: the port and the Python driver. The server, the database,
# both credentials, the role and the schema name one particular database, so they are declared
# empty and the PLAYBOOK supplies them where a reader can see them (meta/main.yml,
# tasks/validate.yml).
#
# ============================================================================================= #
---
keycloak_db_config_defaults:

  #region ------ [ Database ] ----------------------------------------------------------------- #

  # The PostgreSQL server and the database Keycloak runs in.
  host: ''
  port: 5432
  name: ''

  # The database's administrative credential: it provisions the role and owns the schema.
  administrator:
    username: ''
    password: ''

  # The login role Keycloak runs as, and the most connections it may hold.
  role:
    name: ''
    password: ''
    connection_limit: 0

  # The schema Keycloak creates its tables in.
  schema: ''

  #endregion --- [ Database ] ----------------------------------------------------------------- #

  #region ------ [ Python Driver ] ------------------------------------------------------------ #

  # The modules import psycopg2 under the inventory's python3.12, so this is psycopg2 built for
  # it, from RHEL 8 AppStream. python_driver_path is where that package installs it, which
  # fapolicyd must list before the modules load it.
  python_driver_package: 'python3.12-psycopg2'
  python_driver_path: '/usr/lib64/python3.12/site-packages/psycopg2/'

  #endregion --- [ Python Driver ] ------------------------------------------------------------ #
