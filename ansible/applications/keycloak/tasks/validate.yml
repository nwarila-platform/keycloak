# ============================================================================================= #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Validates the merged keycloak configuration on the CONTROLLER, before anything touches the
# guest, so a missing or malformed input fails in a second rather than mid-converge at the cost
# of an instance. meta/main.yml describes these inputs; this file enforces them.
#
# ============================================================================================= #
---

#region ------ [ Validate: The Inputs Removal Reads ] ----------------------------------------- #

# check: safety-critical -- state=absent deletes install_root recursively and the account by
# name, so each must be one plain name: no dot-only path segment, nothing outside /opt.
- name: 'VALIDATE | Require A Removable Install Root And Account'
  when: (state | default('present') | string | lower | trim) in ['present', 'absent']

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to continue: install_root must be one directory directly under /opt and account
      one lower-case system account name, because state=absent removes both. Got install_root
      '{{ keycloak_running.install_root | default('') }}', account
      '{{ keycloak_running.account | default('') }}', fapolicyd_trust_file
      '{{ keycloak_running.fapolicyd_trust_file | default('') }}'.
    quiet: true
    that:
      - keycloak_running.install_root | default('') is match('^/opt/[A-Za-z0-9][A-Za-z0-9._-]*$')
      - keycloak_running.account | default('') is match('^[a-z_][a-z0-9_-]{0,31}$')
      - >-
        keycloak_running.fapolicyd_trust_file | default('')
        is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')

#endregion --- [ Validate: The Inputs Removal Reads ] ----------------------------------------- #

#region ------ [ Validate: The Pinned Installer ] --------------------------------------------- #

# check: safety-critical -- the version names the directory the tarball unpacks into and is
# compared with what Keycloak reports, and the digest is the only thing vouching for the bytes.
- name: 'VALIDATE | Require The Pinned Installer'
  when: (state | default('present') | string | lower | trim) == 'present'

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to deploy: the playbook must supply installer.bucket (an S3 bucket name),
      installer.version (three numeric parts, e.g. 26.7.5) and installer.sha256 (64 lower-case
      hex characters), and installer.key must carry the <version> token. The bucket is not echoed
      because it carries the account id. Got version
      '{{ keycloak_running.installer.version | default('') }}', sha256
      '{{ keycloak_running.installer.sha256 | default('') }}', key
      '{{ keycloak_running.installer.key | default('') }}'.
    quiet: true
    that:
      - >-
        keycloak_running.installer.bucket | default('')
        is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - keycloak_running.installer.key | default('') is search('<version>')
      - keycloak_running.installer.version | default('') is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - keycloak_running.installer.sha256 | default('') is match('^[0-9a-f]{64}$')

#endregion --- [ Validate: The Pinned Installer ] --------------------------------------------- #
